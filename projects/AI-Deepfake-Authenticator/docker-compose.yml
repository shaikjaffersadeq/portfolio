version: '3.8'

services:
  authenticator-dashboard:
    build: .
    container_name: deepfake-authenticator-ui
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  authenticator-api:
    build: .
    container_name: deepfake-authenticator-api
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped